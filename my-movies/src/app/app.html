<div class="container">
  <h1>My Movie Watchlist</h1>
  <p class="stats">{{ watchedCount() }} / {{ movies().length }} watched</p>

  <form class="add-form" (ngSubmit)="addMovie()">
    <input [(ngModel)]="newTitle" name="title" placeholder="Movie title" />
    <input [(ngModel)]="newGenre" name="genre" placeholder="Genre" />
    <button type="submit" [disabled]="!newTitle.trim()">Add</button>
  </form>

  <ul class="list">
    @for (movie of movies(); track movie.id) {
      <li [class.watched]="movie.watched">
        <div>
          <strong>{{ movie.title }}</strong>
          <span class="genre">{{ movie.genre }}</span>
        </div>
        <div class="actions">
          <button (click)="toggleWatched(movie)">
            {{ movie.watched ? 'Unwatch' : 'Watched' }}
          </button>
          <button class="danger" (click)="deleteMovie(movie.id)">Delete</button>
        </div>
      </li>
    } @empty {
      <li class="empty">No movies yet — add one above!</li>
    }
  </ul>

  @if (movies().length > 0) {
    <button class="danger clear" (click)="clearAll()">Clear all</button>
  }
</div>
